name: Build

# ビルド忘れ防止 (issue #5):
# ブランチへの push 時にビルドを実行し、assets/ に差分が出たら
# そのブランチに自動コミットする。main は PR 必須のため、
# マージ前のブランチ上でビルド成果物を最新化する方式を取る。
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit build artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m 'chore(build): update build artifacts [skip ci]'
            git push
          fi
